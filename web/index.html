<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TrendBot</title>
  <meta name="description" content="Trend-following trading bot for Binance, Bybit and Alpaca.">
  <meta name="theme-color" content="#1a2a44">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <script>
    // Apply a saved theme before the page paints, so there's no flash.
    try { const t = localStorage.getItem("tb-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" crossorigin src="./assets/index-PEnWsUGw.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-B1Gzy6Hv.css">
</head>
<body>
  <div id="root"><div id="boot" style="font:15px system-ui,sans-serif;text-align:center;padding:80px 20px;color:#8a929c">Loading TrendBot…</div></div>
  <noscript>TrendBot needs JavaScript enabled.</noscript>
  <script>
    // Safety net: if the app hasn't started after a while (a stale saved copy, a file that failed to
    // download, an old browser), repair it automatically once; if that doesn't help, explain what to do.
    (function () {
      var errors = [];
      // Capture phase also catches files that fail to load (those errors don't reach normal handlers).
      window.addEventListener("error", function (e) {
        var t = e.target;
        if (t && t !== window && (t.src || t.href)) errors.push("Couldn't load " + (t.src || t.href));
        else errors.push(e.message || String(e));
      }, true);
      window.addEventListener("unhandledrejection", function (e) { errors.push(String(e.reason)); });
      function clearSaved() {
        var jobs = [];
        try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
        try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
        return Promise.all(jobs).catch(function () {});
      }
      function freshReload() {
        clearSaved().then(function () {
          var url = location.pathname + "?fresh=" + Date.now() + location.hash;
          location.replace(url);
        });
      }
      window.tbReset = freshReload;
      var tries = 0;
      try { tries = +sessionStorage.getItem("tb-repair") || 0; } catch (e) {}
      function check() {
        if (window.__tbStarted) { try { sessionStorage.removeItem("tb-repair"); } catch (e) {} return; }
        if (tries < 1) {  // first time: repair silently
          try { sessionStorage.setItem("tb-repair", String(tries + 1)); } catch (e) {}
          var boot = document.getElementById("boot");
          if (boot) boot.textContent = "Updating TrendBot…";
          freshReload();
          return;
        }
        try { sessionStorage.removeItem("tb-repair"); } catch (e) {}
        document.getElementById("root").innerHTML = '<div style="font:15px system-ui,sans-serif;max-width:440px;margin:60px auto;padding:20px;text-align:center">' +
          '<h2 style="margin:0 0 10px">TrendBot couldn\'t start</h2>' +
          '<p>The app didn\'t load in this browser. Check your internet connection, then:</p>' +
          '<button onclick="tbReset()" style="font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:0;background:#2a78d6;color:#fff;cursor:pointer">Try again</button>' +
          '<p style="color:#8a929c;font-size:13px;margin-top:16px">Still stuck? Turn off ad-blockers or "tracking prevention" for this site, or open it in Chrome or Edge.</p>' +
          (errors.length ? '<pre style="text-align:left;white-space:pre-wrap;font-size:12px;color:#d23c3c">' + errors.join("\n").replace(/</g, "&lt;") + '</pre>' : '') +
          '</div>';
      }
      // Wait for the page (and its app file) to finish loading, plus a grace period for slow devices.
      function arm() { setTimeout(check, 6000); }
      if (document.readyState === "complete") arm(); else window.addEventListener("load", arm);
    })();
  </script>
</body>
</html>
